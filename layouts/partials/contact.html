<section id="contact" class="section bg-background contact-section">
  <div class="container" style="max-width: 42rem; text-align: center;">
    <div class="fade-in">
      <h2 class="font-display font-bold mb-5" style="font-size: clamp(2.25rem, 4vw, 3rem);">Let's get in touch</h2>
      <p class="text-lg text-muted leading-relaxed mb-12">
        Email is the best way to reach me. LinkedIn and GitHub work too.
      </p>

      <div style="display: flex; flex-direction: column; gap: 1rem; text-align: left;">
        <a href="mailto:{{ .Site.Params.email }}" class="contact-link">
          <div class="contact-icon"><svg class="icon-md" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg></div>
          <div><p class="text-sm font-medium text-muted">Email</p><p class="font-semibold">{{ .Site.Params.email }}</p></div>
        </a>
        <a href="{{ .Site.Params.linkedin }}" target="_blank" rel="noreferrer" class="contact-link">
          <div class="contact-icon"><svg class="icon-md" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect width="4" height="12" x="2" y="9"/><circle cx="4" cy="4" r="2"/></svg></div>
          <div><p class="text-sm font-medium text-muted">LinkedIn</p><p class="font-semibold flex items-center gap-2" style="word-break: break-all;">{{ .Site.Params.linkedin }} <svg style="width:0.875rem;height:0.875rem" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg></p></div>
        </a>
        <a href="{{ .Site.Params.github }}" target="_blank" rel="noreferrer" class="contact-link">
          <div class="contact-icon"><svg class="icon-md" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg></div>
          <div><p class="text-sm font-medium text-muted">GitHub</p><p class="font-semibold flex items-center gap-2" style="word-break: break-all;">{{ .Site.Params.github }} <svg style="width:0.875rem;height:0.875rem" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg></p></div>
        </a>
      </div>
    </div>
  </div>
</section>
