<section id="projects" class="section bg-background">
  <div class="container" style="max-width: 64rem;">
    <div class="fade-in">
      <h2 class="section-header mb-10"><span class="section-bar"></span>Projects</h2>
      <div class="project-grid">
        {{ range .Site.Data.projects }}
        <article class="card p-6 project-card-pink">
          <p class="project-context">{{ .context }}</p>
          <h3 class="font-bold" style="font-size: 1.35rem; margin: 0.25rem 0 0.75rem;">{{ .title }}</h3>
          <p class="text-muted leading-relaxed" style="margin-bottom: 1rem;">{{ .summary }}</p>
          <div class="flex flex-wrap gap-2" style="margin-bottom: 1.25rem;">
            {{ range .tech }}<span class="tech-tag">{{ . }}</span>{{ end }}
          </div>
          {{ with .repo }}
          <a href="{{ . }}" target="_blank" rel="noreferrer" class="project-link">View on GitHub</a>
          {{ end }}
        </article>
        {{ end }}
      </div>
    </div>
  </div>
</section>
