<section id="top" class="hero">
  <div class="hero-bg">
    <img src="{{ .Site.Params.heroBackground | relURL }}" alt="" aria-hidden="true">
  </div>

  <div class="container" style="max-width: 80rem;">
    <div class="hero-content">
      <div class="fade-in flex-1" style="text-align: center;">
        <div class="location-tag mb-6">
          <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
          {{ .Site.Params.location }}
        </div>

        <h1 class="hero-title">
          Hello, I am <span class="text-primary italic hero-name">{{ .Site.Params.firstName }}</span>
        </h1>

        <p class="text-muted hero-tagline">{{ .Site.Params.tagline }}</p>

        <div class="flex gap-4 items-center" style="flex-wrap: wrap; justify-content: center;">
          <a href="#experience" class="btn btn-primary btn-lg" data-scroll="experience">See my research</a>
          <a href="#contact" class="btn btn-outline btn-lg" data-scroll="contact">Say hello</a>
        </div>

        <div class="flex items-center justify-center gap-6 mt-10 text-muted" style="flex-wrap: wrap;">
          <a href="mailto:{{ .Site.Params.email }}" class="flex items-center gap-2 transition-colors hover:text-primary">
            <svg class="icon-md" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg> <span class="text-sm font-medium">Email</span>
          </a>
          <a href="{{ .Site.Params.linkedin }}" target="_blank" rel="noreferrer" class="flex items-center gap-2 transition-colors hover:text-primary">
            <svg class="icon-md" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect width="4" height="12" x="2" y="9"/><circle cx="4" cy="4" r="2"/></svg> <span class="text-sm font-medium">LinkedIn</span>
          </a>
          <a href="{{ .Site.Params.github }}" target="_blank" rel="noreferrer" class="flex items-center gap-2 transition-colors hover:text-primary">
            <svg class="icon-md" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg> <span class="text-sm font-medium">GitHub</span>
          </a>
        </div>
      </div>

      <div class="fade-in-none hero-photo delay-2">
        <img src="{{ .Site.Params.profileImage | relURL }}" alt="Portrait of {{ .Site.Params.fullName }}">
      </div>
    </div>
  </div>
</section>
